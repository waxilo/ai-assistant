# 构建 TraeWorkAssistant（macOS universal + Windows NSIS）并发布到 ai-assistant 仓库的
# GitHub Release，使应用内更新（@tauri-apps/plugin-updater）可用。
#
# 触发方式：
#   1. 打 tag `traework-v<版本>` 并推送（版本号以 tag 为准，覆盖 tauri.conf.json）
#   2. 手动 workflow_dispatch（用 tauri.conf.json 里的版本号）
#
# 需要的仓库 Secrets：
#   TAURI_SIGNING_PRIVATE_KEY            —— updater 签名私钥（`npm run tauri signer generate` 生成）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   —— 私钥密码，无密码可不配
#   MACOS_CERT_P12                       —— macOS 代码签名证书（base64 的 p12，内含叶证书+私钥+自签 CA）
#   MACOS_CERT_PASSWORD                  —— 该 p12 的密码
#
# ⚠️ macOS 证书是**必需项**，不是可选优化：`tauri.conf.json` 里写死了
#    `bundle.macOS.signingIdentity`，缺证书时 `tauri build` 会直接失败。
#    为什么必须有固定身份，见下方「导入 macOS 签名证书」步骤的注释。
name: Release TraeWorkAssistant

on:
  workflow_dispatch:
  push:
    tags: ["traework-v*"]

env:
  APP_DIR: traework-assistant
  RELEASE_REPO: waxilo/ai-assistant

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            bundles: app,dmg
          - platform: windows-latest
            target: ""
            bundles: nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: 添加 macOS 双架构 target
        if: matrix.target != ''
        shell: bash
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.APP_DIR }}/src-tauri

      - name: 安装前端依赖
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: npm ci

      - name: 确定版本号（tag 优先，否则读配置）
        id: version
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          REF="$GITHUB_REF_NAME"
          if [[ "$REF" == traework-v* ]]; then
            V="${REF#traework-v}"
          else
            V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: 检查签名私钥
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "::error::缺少 TAURI_SIGNING_PRIVATE_KEY secret。"
            echo "请先在本地跑 `npx tauri signer generate` 拿到私钥，"
            echo "并把私钥（及密码）配到本仓库 Actions secrets。"
            exit 1
          fi

      # ⚠️ 签名身份**必须**有：未签名（或 ad-hoc 签名）的包，macOS 会把「App 管理」的授权
      # 记在易变的 cdhash 上 —— 每次重新构建 / 自动更新后授权即失效，用户又要重新授权一遍。
      # 这里导入自签代码签名证书（自签 CA + 叶证书）；身份名由 tauri.conf.json 的
      # `bundle.macOS.signingIdentity` 指定，两处必须一致，否则构建直接失败。
      - name: 导入 macOS 签名证书
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          CERT_P12_B64: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${CERT_P12_B64:-}" ]; then
            echo "::error::缺少 secret MACOS_CERT_P12 —— 未签名的构建会让 macOS「App 管理」授权在每次更新后失效，拒绝继续。"
            echo "生成方式见本机 traework-assistant/docs/macOS代码签名.md（docs/ 按约定未入库）。"
            exit 1
          fi

          P12="$RUNNER_TEMP/twa.p12"
          CA="$RUNNER_TEMP/twa-ca.crt"
          KEYCHAIN="$RUNNER_TEMP/twa-signing.keychain-db"

          echo "$CERT_P12_B64" | openssl base64 -d -A > "$P12"

          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"

          # 构建用的 codesign 要在这个钥匙串里找到身份（保留原有的搜索条目）
          EXISTING=$(security list-keychains -d user | tr -d ' "' | tr '\n' ' ')
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING

          # 自签 CA 必须被信任，否则 codesign 看不到任何可用身份
          security find-certificate -c "TraeWorkAssistant Local CA" -p "$KEYCHAIN" > "$CA"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$CA"

          security find-identity -v -p codesigning "$KEYCHAIN"
          rm -f "$P12"

      - name: Tauri build（带更新产物）
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ARGS="--config {\"version\":\"${{ steps.version.outputs.version }}\"} --bundles ${{ matrix.bundles }}"
          if [ -n "${{ matrix.target }}" ]; then
            ARGS="$ARGS --target ${{ matrix.target }}"
          fi
          npx tauri build $ARGS

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            ${{ env.APP_DIR }}/src-tauri/target/**/release/bundle/**/*.exe
            ${{ env.APP_DIR }}/src-tauri/target/**/release/bundle/**/*.msi
            ${{ env.APP_DIR }}/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            ${{ env.APP_DIR }}/src-tauri/target/**/release/bundle/**/*.dmg
            ${{ env.APP_DIR }}/src-tauri/target/**/release/bundle/**/*.sig
            ${{ env.APP_DIR }}/src-tauri/target/**/release/bundle/**/latest.json

  release:
    name: 发布到 waxilo/ai-assistant
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 确定版本号
        id: version
        shell: bash
        run: |
          REF="$GITHUB_REF_NAME"
          if [[ "$REF" == traework-v* ]]; then
            V="${REF#traework-v}"
          else
            V=$(node -p "require('./${{ env.APP_DIR }}/src-tauri/tauri.conf.json').version")
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: 收集安装包（重命名带上平台标识，.sig 随产物同步改名）
        shell: bash
        run: |
          mkdir -p dist
          V="${{ steps.version.outputs.version }}"
          # macOS：按扩展精确重命名为 产品名-macos-版本.{app.tar.gz|dmg}（含 .sig）
          PRODUCT=$(node -p "require('./${{ env.APP_DIR }}/src-tauri/tauri.conf.json').productName")
          for f in $(find artifacts/bundle-macos-latest -type f); do
            base=$(basename "$f")
            case "$base" in
              *.app.tar.gz.sig) cp "$f" "dist/${PRODUCT}-macos-${V}.app.tar.gz.sig" ;;
              *.app.tar.gz)     cp "$f" "dist/${PRODUCT}-macos-${V}.app.tar.gz" ;;
              *.dmg.sig)        cp "$f" "dist/${PRODUCT}-macos-${V}.dmg.sig" ;;
              *.dmg)            cp "$f" "dist/${PRODUCT}-macos-${V}.dmg" ;;
            esac
          done
          # Windows：重命名为 产品名_windows_版本.exe（含 .sig）
          for f in $(find artifacts/bundle-windows-latest -type f); do
            base=$(basename "$f")
            product="${base%%_*}"
            if [[ "$base" == *.sig ]]; then
              ext="${base%.sig}"; ext="${ext##*.}"
              cp "$f" "dist/${product}_windows_${V}.${ext}.sig"
            else
              ext="${base##*.}"
              cp "$f" "dist/${product}_windows_${V}.${ext}"
            fi
          done

      - name: 生成 latest.json（v2 CLI 只产 .sig，manifest 需自行拼装）
        shell: bash
        run: node scripts/build-latest.mjs "${{ steps.version.outputs.version }}" traework-latest dist "${{ env.RELEASE_REPO }}"

      - name: 发布 Release（固定 tag，两个应用各自独立，版本号随意演进）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: |
          TAG="traework-latest"
          gh release delete "$TAG" --repo "${{ env.RELEASE_REPO }}" --yes || true
          gh release create "$TAG" * \
            --repo "${{ env.RELEASE_REPO }}" \
            --title "TraeWorkAssistant（自动构建）" \
            --notes "版本 ${{ steps.version.outputs.version }}：macOS universal + Windows NSIS"
