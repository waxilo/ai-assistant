name = "cred-broker"
main = "src/index.js"
compatibility_date = "2024-09-23"
account_id = "33d023f61ebac424923f7285f9b142f8"

# 自定义域名（zone sloan.dpdns.org 已在当前账号内）。
# 客户端把这个地址写成**编译期常量**，所以换域等于改代码 + 重新构建。
routes = [
  { pattern = "cred-broker.sloan.dpdns.org", custom_domain = true }
]

# **故意不挂 Cron。**
# 续签由客户端执行，服务端只做「存 + 发闸」，没有任何需要后台跑的事。
# 挂一个空跑的定时任务只会让人以为「管家会自己续签」。
[triggers]
crons = []

[vars]
# 续签闸的租约时长。**必须大于客户端「把这一池该签的都签掉 + 提交结果」的最坏耗时**，
# 否则租约提前失效、第二台机器拿到闸，而单链轮换下两边都可能死。
# 闸的作用域是整池，所以要容得下「一轮里连续签若干个账号」，而不只是单个请求的耗时。
# 正常路径上签完就立刻归还，这个值只决定「出意外时闸被占多久」。
LEASE_MS = "180000"
# 续签失败后的冷静期：凭证真死时，别让几台机器轮流敲同一条已死的链。
FAIL_COOLDOWN_MS = "300000"

# 凭证池的落库（pools + pool_events）。
[[d1_databases]]
binding = "DB"
database_name = "cred-broker"
database_id = "ff49da6f-4c43-40cc-940c-e5235f01ae0d"
