[package]
name = "qoder-assistant"
version = "0.1.9"
description = "Qoder 多账号签到桌面助手"
authors = ["waxilo"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "qoder_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：后台常驻托盘（关闭窗口不退出进程，定时签到/反代持续生效）
tauri = { version = "2", features = ["tray-icon"] }
# 单实例守卫：托盘常驻后用户再点图标会起第二个进程（Windows 上尤其明显）。
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 文件对话框：账号导出 / 导入选路径用
tauri-plugin-dialog = "2"
# 开机自启动：定时签到只有应用在跑才可能触发，所以由应用自己注册登录启动项。
# 只在 Rust 侧调用（`app.autolaunch()`），因此不需要前端 npm 包，也不需要额外 capability。
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
regex = "1"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
# PKCE：Qoder 登录用 S256 challenge（base64url(sha256(verifier))）
sha2 = "0.10"
minisign-verify = "0.2"
thiserror = "1"
# —— Qoder 本机凭据（auth.v1.dat）OSCrypt 解密/回写 ——
# `auth.v1.dat` 是 Chromium `safeStorage`（OSCrypt）的产物，**两个平台的封装不一样**：
# Windows = DPAPI 解出 32B 原始密钥 + AES-256-GCM；macOS = 钥匙串密码经 PBKDF2-SHA1
# 派生 16B 密钥 + AES-128-CBC。所以下面两组依赖都要：
# - Windows 分支：aes-gcm / aead
# - macOS 分支：aes + cbc + block-padding（AES-128-CBC/PKCS7），hmac + sha1（PBKDF2-SHA1）
aes-gcm = { version = "0.10", features = ["aes"] }
aead = "0.5"
rand = "0.8"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
block-padding = "0.3"
hmac = "0.12"
sha1 = "0.10"
# —— COSY 凭据重签（这才是「真接管」的落点）——
# Qoder 客户端**不拿 Bearer token 认证业务接口**，而是把账号凭据**封进请求头自己**：
# `Authorization: Bearer COSY.<payload_b64>.<md5hex>` + `Cosy-User/Cosy-Key/Cosy-Date`。
# 想换号就只能按同一算法重算（见 `src/cosy.rs`）：
#   - AES-128-CBC（已有 aes + cbc + block-padding）
#   - 内嵌 RSA 公钥做 PKCS#1 v1.5 加密 → 需要 `rsa`
#   - 载荷摘要是 **MD5**（不是 sha256）→ 需要 `md-5`
md-5 = "0.10"
# 用默认 features（含 `pem`/`std`）：`RsaPublicKey::from_public_key_pem` 是
# `pkcs8::DecodePublicKey` trait 提供的，把 features 砍到最小反而会把它关掉。
rsa = "0.9"
# —— 智能接管的本地 TLS ——
# Qoder 客户端把端点 scheme **写死成 https**（覆盖值只校验 `new URL(v).origin`），
# 所以反代必须真的能终止 TLS，否则写进端点的地址会被客户端直接拒绝或握手失败。
# 证书在本机生成（自签 CA + 叶证书，SAN = IP:127.0.0.1），私钥只落本应用数据目录。
# - rustls：同步 `StreamOwned`，与 proxy.rs 现有的 `Read + Write` 手写 HTTP 解析天然契合
# - ring：与 reqwest 已带入的 backend 一致，避免同一 crate 被编两遍
# - rcgen：纯 Rust 生成证书；显式选 ring，避开默认的 aws-lc-rs（需要 cmake）
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
# 目前测试仅用 std + tokio 自带能力，无额外 dev 依赖
